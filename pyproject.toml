[project]
name = "project-ted"
version = "0.1.0"
description = "A weekly multi-agent Fantasy Premier League planner"
readme = "README.md"
authors = [
    { name = "Stephen Obotu Oduh", email = "osobotu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.4.8",
    "langchain-openai>=1.4.1",
    "langchain-tavily>=0.2.18",
    "langsmith>=0.11.0",
    "openai>=3.1.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
